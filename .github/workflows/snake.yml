name: Generate Snake

on:
  schedule:
    - cron: "0 */12 * * *"   # refresh every 12 hours
  workflow_dispatch:          # lets you run it manually
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#b026ff&color_dots=#ebedf0,#e0b3ff,#c77dff,#9d4edd,#7b2cbf
            dist/snake-dark.svg?color_snake=#d070ff&color_dots=#303030,#5a189a,#7b2cbf,#9d4edd,#c77dff

      - name: Hide the purple progress bar at the bottom
        run: |
          python3 - <<'PY'
          import re
          for f in ["dist/snake.svg", "dist/snake-dark.svg"]:
              s = open(f, encoding="utf-8").read()
              m = re.search(r'viewBox="(-?[\d.]+) (-?[\d.]+) ([\d.]+) ([\d.]+)"', s)
              if not m:
                  print("viewBox not found in", f)
                  continue
              x, y, w, h = m.groups()
              new_h = float(h) - 32
              s = s.replace(m.group(0), f'viewBox="{x} {y} {w} {new_h:g}"', 1)
              s = re.sub(r'(<svg[^>]*?\bheight=")[\d.]+(")', lambda k: k.group(1) + f"{new_h:g}" + k.group(2), s, count=1)
              open(f, "w", encoding="utf-8").write(s)
              print("cropped", f, "height", h, "->", f"{new_h:g}")
          PY

      - name: Push SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
