name: Generate Contribution Snake

on:
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Generate Snake Animation
        uses: Platane/snk@v3
        with:
          github_user_name: prathvirajahirwar
          outputs: |
            dist/snake.svg
            dist/snake-dark.svg?color_snake=purple&color_dots=%23151b23,%230e4429,%23006d32,%2326a641,%2339d353&color_dot_border=%231b1f230a

      - name: Deploy to Output Branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: output
